name: CodeQL Security Scanning

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# 最小权限原则：默认仅读仓库内容；分析结果上报所需的 security-events: write 在 analyze job 级声明
permissions:
  contents: read

# E-14/E-25：同一分支/PR 的旧扫描被新提交取消，避免重复占用 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Java
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [java]

    steps:
      - name: Checkout source
        # E-14/E-25：第三方 action 固定到 v4 对应 commit SHA（renovate/dependabot 可识别 # v4）
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # github/codeql-action 固定到 v3 分支当前 commit SHA（对应 tag v3 → commit faaca9a8...）
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Java/Kotlin 提取器必须观察到真实编译过程才能抽取源码。
      # 此前缺少构建步骤，finalize 阶段每次都以 "could not process any of it"（Exit code 32）失败。
      - name: Autobuild (Maven)
        uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        with:
          category: "/language:${{ matrix.language }}"
