name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  guard:
    name: Guards (parent↔BOM property sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify parent pom.xml and streammq-bom/pom.xml dependency versions are in sync
        run: |
          set -euo pipefail
          extract() {
            grep -oP '^\s*<([a-zA-Z0-9.-]+)\.version>[^<]+</\1\.version>\s*$' "$1" \
              | sed -E 's/^\s*<([a-zA-Z0-9.-]+)\.version>([^<]+)<\/\1\.version>\s*$/\1=\2/' \
              | sort
          }
          extract pom.xml > /tmp/parent.props
          extract streammq-bom/pom.xml > /tmp/bom.props
          fail=0
          # 1) 双方共同声明的依赖版本必须一致（BOM 特意不管理父 POM 的插件/测试工具版本，忽略仅单侧存在的键）
          while IFS='=' read -r k v; do
            # ${...} 引用型属性（如 streammq=${project.version}）由下方规则 2 单独核对
            case "$v" in '${'*) continue ;; esac
            bv=$(grep -P "^${k}=" /tmp/bom.props | head -1 | cut -d= -f2- || true)
            if [ -n "$bv" ] && [ "$bv" != "$v" ]; then
              echo "::error::版本属性漂移：$k parent=$v bom=$bv"
              fail=1
            fi
          done < /tmp/parent.props
          # 2) BOM 的 streammq 版本必须等于根 <version>（parent 侧为 ${project.version} 引用，单独核对）
          root_ver=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          bom_streammq=$(grep -P '^streammq=' /tmp/bom.props | cut -d= -f2-)
          if [ "$bom_streammq" != "$root_ver" ]; then
            echo "::error::BOM 管理的 streammq 版本($bom_streammq) 与根 <version>($root_ver) 不一致"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "parent ↔ BOM version properties are in sync"

  build:
    name: Build
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build (compile + enforcer)
        run: mvn clean compile -DskipTests
        # 注：sources/javadoc jar 在 package 阶段才会产出，此处无可上传物，故不配置上传步骤

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run unit tests
        run: mvn test

      - name: Generate IT inventory
        run: |
          set -euo pipefail
          {
            echo "StreamMQ Integration Test Inventory"
            echo "========================================"
            echo "Generated at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            find . -path '*/target' -prune -o -type f -name '*IT.java' -print | sort
          } > integration-tests.txt
          echo "Total IT files: $(grep -c 'IT.java' integration-tests.txt || true)"
          cat integration-tests.txt

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            integration-tests.txt
          if-no-files-found: warn

  verify:
    name: Verify (Integration)
    needs: build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run integration tests
        run: mvn verify

      # Tripwire：集成测试若因 Redis service 容器异常被整体跳过，mvn verify 仍会"绿色"通过。
      # 此步骤解析 failsafe 报告，校验实际执行的 IT 数量下限与跳过率上限，防止静默失效。
      - name: Integration test tripwire (detect silent Redis-service breakage)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          files = glob.glob('**/failsafe-reports/*.xml', recursive=True)
          if not files:
              print("::error::no failsafe-reports/*.xml found — integration tests never ran")
              sys.exit(1)

          total = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              total += int(root.get('tests', 0))
              skipped += int(root.get('skipped', 0))

          executed = total - skipped
          print(f"Failsafe totals: tests={total} skipped={skipped} executed={executed}")

          if executed < 80:
              print("::error::integration tests executed below floor "
                    f"(executed={executed} < 80). Likely cause: the Redis service container "
                    "is unhealthy and ITs were silently skipped. Check redis service logs.")
              sys.exit(1)

          if skipped * 2 > total:
              print("::error::more than 50% of integration tests were skipped "
                    f"(skipped={skipped}/{total}). Likely cause: Redis unavailable to tests.")
              sys.exit(1)

          print("Tripwire OK: integration tests executed above floor and skip rate within limit.")
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-results
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            **/target/site/
          if-no-files-found: warn

  coverage:
    # P3-13：JaCoCo 覆盖率门禁——仅针对"已发布模块"启用 check（core/redisson/starter 等），
    # 未发布模块（samples/benchmark/kubernetes）不参与门禁。阈值见根 POM jacoco check 配置。
    name: Coverage gate (published modules)
    needs: build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # verify 阶段：单测 + 集成测试（需上方 Redis service）一并执行并收集 jacoco 数据，
      # jacoco:report / jacoco:check 已绑定在 verify 阶段（见根 POM），-Djacoco.check.skip=false 启用门禁。
      # 集成测试对覆盖率的贡献不可或缺（redisson 实测：仅单测约 33% 行覆盖，含 IT 达 90%+），
      # 因此必须提供 Redis 并运行 verify，而非仅 test。
      # -am 自动带上所选模块的 reactor 依赖（如 core），确保闭环可解析。
      - name: Coverage check on published modules
        run: >-
          mvn -pl streammq-core,streammq-redisson,streammq-spring-boot-starter,
          streammq-tracing-opentelemetry,streammq-diagnostics,
          streammq-spring-cloud-stream-binder,streammq-test,streammq-test-support
          -am verify -Djacoco.check.skip=false -Dspotless.check.skip=true

  staging-smoke:
    # P2-8：发布预检——把全部模块 install 到本地仓库（模拟 staging），
    # 再从"使用方视角"用一个最小消费工程 import streammq-bom 并编译引用核心 API，
    # 直接验证 BOM 与各发布构件可解析（覆盖 P0-1：BOM 是否真正可用）。
    name: Staging smoke (consumer-side resolve)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Install modules to local repo (simulate staging)
        run: mvn install -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true

      - name: Compile a consumer app against the BOM
        shell: bash
        run: |
          set -euo pipefail
          VER="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mkdir -p /tmp/streammq-smoke/src/main/java/com/example
          cat > /tmp/streammq-smoke/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>streammq-smoke-consumer</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>io.github.streammq</groupId>
                  <artifactId>streammq-bom</artifactId>
                  <version>__SMQ_VER__</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-spring-boot-starter</artifactId>
              </dependency>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-core</artifactId>
              </dependency>
            </dependencies>
          </project>
          EOF
          sed -i "s/__SMQ_VER__/${VER}/" /tmp/streammq-smoke/pom.xml
          cat > /tmp/streammq-smoke/src/main/java/com/example/Smoke.java <<'EOF'
          package com.example;

          import io.github.streammq.core.message.Message;
          import io.github.streammq.core.message.MessageBuilder;
          import java.util.Map;

          /** 仅验证使用方视角下 BOM 可解析、公开 API 可编译引用。 */
          public final class Smoke {
              public static void main(String[] args) {
                  Message<Map<String, Object>> msg =
                          MessageBuilder.<Map<String, Object>>withTopic("smoke")
                                  .body(Map.of("ok", true))
                                  .withUserProperty("traceId", "t-001")
                                  .build();
                  System.out.println(msg.getTopic());
              }
          }
          EOF
          mvn -q -f /tmp/streammq-smoke/pom.xml clean compile

  security:
    name: Dependency vulnerability scan (OWASP)
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run OWASP Dependency-Check
        run: mvn verify -Dowasp.skip=false -DskipTests
        env:
          # 可选：仓库 Secret 中配置 NVD_API_KEY 提升 NVD 查询限额；未配置时空串透传（匿名限速模式）
          NVD_API_KEY: ${{ secrets.NVD_API_KEY || '' }}

      - name: Upload dependency-check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-reports
          path: |
            **/target/dependency-check-report.html
          if-no-files-found: warn