name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    name: Test (gate before publish)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi

      # 发布门禁：单测 + 集成测试 + Spotless/JaCoCo 全部通过才允许进入 deploy job。
      # 此前发布通道直接 deploy -DskipTests，完全绕过质量门禁，属高危流程缺陷。
      - name: Run full verify (unit + integration)
        run: mvn clean verify -B

      # P2-13 门禁：API 兼容性检查（japicmp）。
      # 探测 Maven Central 上已发布的上一版本；若存在（即非首个版本），
      # 对比当前源码构建产物与上一版本的二进制/源码兼容性，发现破坏性变更则阻断发布。
      # 首个公开版本（Central 无历史）时自动跳过。
      - name: API compatibility gate (japicmp vs previous release)
        shell: bash
        run: |
          set -euo pipefail
          metadata_url="https://repo1.maven.org/maven2/io/github/streammq/streammq-core/maven-metadata.xml"
          prev="$(curl -fsSL "${metadata_url}" 2>/dev/null | grep -oP '(?<=<release>)[^<]+' | head -1 || true)"
          if [[ -z "${prev}" ]]; then
            echo "No previous release on Maven Central — first public release, API compatibility gate skipped."
            exit 0
          fi
          echo "Comparing API compatibility against previous release: ${prev}"
          mvn -pl streammq-core,streammq-redisson,streammq-spring-boot-starter,\
          streammq-tracing-opentelemetry,streammq-diagnostics,streammq-spring-cloud-stream-binder,\
          streammq-test,streammq-test-support \
              -am verify \
              -Djapicmp.skip=false -Djapicmp.oldVersion="${prev}" \
              -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true -B

      # P2-8 门禁：发布预检（staging smoke）——将全部构件 install 到本地仓库（模拟 staging），
      # 再以"使用方视角"最小工程 import streammq-bom 并编译引用公开 API，
      # 验证 BOM 与各发布构件在真实消费场景下可解析（覆盖 P0-1：BOM 必须被发布）。
      - name: Staging smoke (consumer-side resolve)
        shell: bash
        run: |
          set -euo pipefail
          mvn install -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true -q
          VER="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          mkdir -p /tmp/streammq-smoke/src/main/java/com/example
          cat > /tmp/streammq-smoke/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>streammq-smoke-consumer</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>io.github.streammq</groupId>
                  <artifactId>streammq-bom</artifactId>
                  <version>__SMQ_VER__</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-spring-boot-starter</artifactId>
              </dependency>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-core</artifactId>
              </dependency>
            </dependencies>
          </project>
          EOF
          sed -i "s/__SMQ_VER__/${VER}/" /tmp/streammq-smoke/pom.xml
          cat > /tmp/streammq-smoke/src/main/java/com/example/Smoke.java <<'EOF'
          package com.example;

          import io.github.streammq.core.message.Message;
          import io.github.streammq.core.message.MessageBuilder;
          import java.util.Map;

          /** 仅验证使用方视角下 BOM 可解析、公开 API 可编译引用。 */
          public final class Smoke {
              public static void main(String[] args) {
                  Message<Map<String, Object>> msg =
                          MessageBuilder.<Map<String, Object>>withTopic("smoke")
                                  .body(Map.of("ok", true))
                                  .withUserProperty("traceId", "t-001")
                                  .build();
                  System.out.println(msg.getTopic());
              }
          }
          EOF
          mvn -q -f /tmp/streammq-smoke/pom.xml clean compile

  publish:
    name: Publish to Maven Central
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate and extract release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 发布门禁：标签必须指向本次工作流所检出的提交。
      # 若标签先于修复提交打出（"先打 tag 再改代码"），这里的校验会失败，避免把
      # 与标签内容不一致的二进制发布到 Maven Central（中央仓库构件不可变，无法回滚）。
      - name: Verify tag points at the checked-out commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          echo "tag=${RELEASE_TAG} tag_commit=${tag_commit}"
          echo "head_commit=${head_commit}"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} points at ${tag_commit}, but the workflow checked out ${head_commit}."
            echo "::error::The tag was created before the latest commits. Delete and re-create the tag on the"
            echo "::error::intended commit, then re-run the release:"
            echo "::error::  git tag -d ${RELEASE_TAG} && git push origin :refs/tags/${RELEASE_TAG}"
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} matches HEAD"

      - name: Set project version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # streammq-bom 独立于 parent、内部以属性硬编码 streammq.version；
      # versions:set 不会更新该属性，需单独 set-property，否则 BOM 会指向不存在的旧版本。
      - name: Sync BOM version property
        run: mvn versions:set-property -Dproperty=streammq.version -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # 测试已在 test job 通过（needs: test 门禁），此处跳过仅为避免重复执行
      - name: Build and deploy to Maven Central
        run: mvn clean deploy -DskipTests -Pgpg
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: StreamMQ ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            streammq-bom/target/streammq-bom-${{ steps.version.outputs.version }}.pom
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-sources.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}-sources.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}-sources.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-tracing-opentelemetry/target/streammq-tracing-opentelemetry-${{ steps.version.outputs.version }}.jar
            streammq-tracing-opentelemetry/target/streammq-tracing-opentelemetry-${{ steps.version.outputs.version }}-sources.jar
            streammq-tracing-opentelemetry/target/streammq-tracing-opentelemetry-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-diagnostics/target/streammq-diagnostics-${{ steps.version.outputs.version }}.jar
            streammq-diagnostics/target/streammq-diagnostics-${{ steps.version.outputs.version }}-sources.jar
            streammq-diagnostics/target/streammq-diagnostics-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-spring-cloud-stream-binder/target/streammq-spring-cloud-stream-binder-${{ steps.version.outputs.version }}.jar
            streammq-spring-cloud-stream-binder/target/streammq-spring-cloud-stream-binder-${{ steps.version.outputs.version }}-sources.jar
            streammq-spring-cloud-stream-binder/target/streammq-spring-cloud-stream-binder-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}-sources.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-test-support/target/streammq-test-support-${{ steps.version.outputs.version }}.jar
            streammq-test-support/target/streammq-test-support-${{ steps.version.outputs.version }}-sources.jar
            streammq-test-support/target/streammq-test-support-${{ steps.version.outputs.version }}-javadoc.jar
