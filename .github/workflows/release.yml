name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

# E-14/E-25：发布流程**不取消**进行中的运行（cancel-in-progress: false），
# 中央仓库构件不可变，任何一次发布都必须完整走完或人工干预，不能被并发触发静默掐断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # F-2：发布通道必须自带 CI 的两道硬门禁 —— 此前 guard（发布集一致性）与 sbom-scan
  #（CycloneDX SBOM + osv-scanner keyless CVE 硬门禁）只在 ci.yml 中，release.yml 完全没有；
  # 指向"从未过 CI"的 commit 打 tag 时，High/Critical CVE 与发布集漂移可直接进入 Central（构件不可变）。
  # 两个 job 的命令/SHA/版本与 ci.yml 完全一致（保持单一口径），并与 test job 并行（不拉长关键路径）。
  # 自包含优于"断言同 commit 的 CI 成功"：后者依赖 CI 的存在与状态可查询，且 --no-verify 之外的
  # 路径（如直接推送 tag）无法覆盖。
  guard:
    name: Guards (parent↔BOM sync + publish set consistency)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 最小权限：本 job 只读仓库内容（workflow 级为 contents: write，仅 Create GitHub Release 需要）
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify parent pom.xml and streammq-bom/pom.xml dependency versions are in sync
        run: |
          set -euo pipefail
          extract() {
            grep -oP '^\s*<([a-zA-Z0-9.-]+)\.version>[^<]+</\1\.version>\s*$' "$1" \
              | sed -E 's/^\s*<([a-zA-Z0-9.-]+)\.version>([^<]+)<\/\1\.version>\s*$/\1=\2/' \
              | sort
          }
          extract pom.xml > /tmp/parent.props
          extract streammq-bom/pom.xml > /tmp/bom.props
          fail=0
          # 1) 双方共同声明的依赖版本必须一致（BOM 特意不管理父 POM 的插件/测试工具版本，忽略仅单侧存在的键）
          while IFS='=' read -r k v; do
            # ${...} 引用型属性（如 streammq=${project.version}）由下方规则 2 单独核对
            case "$v" in '${'*) continue ;; esac
            bv=$(grep -P "^${k}=" /tmp/bom.props | head -1 | cut -d= -f2- || true)
            if [ -n "$bv" ] && [ "$bv" != "$v" ]; then
              echo "::error::版本属性漂移：$k parent=$v bom=$bv"
              fail=1
            fi
          done < /tmp/parent.props
          # 2) BOM 的 streammq 版本必须等于根 <version>（parent 侧为 ${project.version} 引用，单独核对）
          root_ver=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          bom_streammq=$(grep -P '^streammq=' /tmp/bom.props | cut -d= -f2-)
          if [ "$bom_streammq" != "$root_ver" ]; then
            echo "::error::BOM 管理的 streammq 版本($bom_streammq) 与根 <version>($root_ver) 不一致"
            fail=1
          fi
          [ "$fail" -eq 0 ] || exit 1
          echo "parent ↔ BOM version properties are in sync"

      # E-06：发布集一致性守卫 —— 三个清单（根 POM <modules>、central-publishing 的
      # <excludeArtifacts>、streammq-bom 管理的 io.github.streammq:* 构件）必须严格等价，
      # 否则会出现「BOM 里管理了永不发布的构件」或「发布了但 BOM 里没有」的静默漂移。
      # 断言：({全部模块} ∪ {streammq-parent}) − {excludeArtifacts} == {BOM 管理集合} ∪ {streammq-parent, streammq-bom}
      - name: Publish-set consistency guard (modules ↔ excludeArtifacts ↔ BOM)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          def local(tag):
              return tag.split('}')[-1]

          def child_text(el, name):
              for c in el:
                  if local(c.tag) == name:
                      return (c.text or '').strip()
              return None

          def collect_modules(pom_path):
              """递归收集 pom_path（含嵌套 <modules>）中所有项目的 artifactId。"""
              root = ET.parse(pom_path).getroot()
              artifacts = set()
              own = child_text(root, 'artifactId')
              if own:
                  artifacts.add(own)
              base = pom_path.rsplit('/', 1)[0] if '/' in pom_path else ''
              for el in root:
                  if local(el.tag) != 'modules':
                      continue
                  for m in el:
                      if local(m.tag) != 'module' or not (m.text or '').strip():
                          continue
                      sub = m.text.strip().replace('\\', '/')
                      sub_pom = f"{base}/{sub}/pom.xml" if base else f"{sub}/pom.xml"
                      artifacts |= collect_modules(sub_pom)
              return artifacts

          def exclude_artifacts(pom_path):
              root = ET.parse(pom_path).getroot()
              excluded = set()
              for plugin in root.iter():
                  if local(plugin.tag) != 'plugin':
                      continue
                  if child_text(plugin, 'artifactId') != 'central-publishing-maven-plugin':
                      continue
                  for cfg in plugin:
                      if local(cfg.tag) != 'configuration':
                          continue
                      for el in cfg:
                          if local(el.tag) == 'excludeArtifacts' and (el.text or '').strip():
                              excluded |= {x.strip() for x in el.text.split(',') if x.strip()}
              return excluded

          def bom_managed(pom_path):
              root = ET.parse(pom_path).getroot()
              managed = set()
              for dm in root.iter():
                  if local(dm.tag) != 'dependencyManagement':
                      continue
                  for deps in dm:
                      if local(deps.tag) != 'dependencies':
                          continue
                      for dep in deps:
                          if local(dep.tag) != 'dependency':
                              continue
                          if child_text(dep, 'groupId') == 'io.github.streammq':
                              art = child_text(dep, 'artifactId')
                              if art:
                                  managed.add(art)
              return managed

          all_modules = collect_modules('pom.xml')
          excluded = exclude_artifacts('pom.xml')
          if not excluded:
              print("::error::cannot read <excludeArtifacts> from central-publishing-maven-plugin in pom.xml")
              sys.exit(1)

          published = all_modules - excluded          # 含 streammq-parent / streammq-bom
          expected = bom_managed('streammq-bom/pom.xml') | {'streammq-parent', 'streammq-bom'}

          print(f"modules ({len(all_modules)}): {sorted(all_modules)}")
          print(f"excludeArtifacts ({len(excluded)}): {sorted(excluded)}")
          print(f"published = modules - excludeArtifacts ({len(published)}): {sorted(published)}")
          print(f"expected = BOM-managed ∪ {{streammq-parent, streammq-bom}} ({len(expected)}): {sorted(expected)}")

          only_published = published - expected
          only_bom = expected - published
          if only_published or only_bom:
              print(f"::error::publish-set drift — published-only (must be added to the BOM): {sorted(only_published)}")
              print(f"::error::publish-set drift — BOM-only (must be published or removed from the BOM): {sorted(only_bom)}")
              sys.exit(1)
          print("Publish set is consistent: published == BOM-managed ∪ {streammq-parent, streammq-bom}")
          PY

  # F-2：release 通道的 keyless CVE 硬门禁（与 ci.yml 的 sbom-scan 同命令、同版本、同 SHA256）。
  # 发布前必须先过此门禁：release.yml 此前完全依赖可选的 NVD 深扫（无密钥即 exit 0），
  # 等于"无密钥时发布通道没有任何 CVE 门禁"。
  sbom-scan:
    name: CVE gate (CycloneDX SBOM + osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Generate aggregate CycloneDX SBOM (target/bom.json)
        # 根 POM pluginManagement 已 pin cyclonedx-maven-plugin 2.9.1 并默认 skip=true
        #（避免影响本地构建），此处显式开启；makeAggregateBom 为 aggregator goal，
        # 聚合产物落在 reactor 根目录 target/bom.json（outputFormat 默认 all，同时产出 bom.xml）。
        #
        # skipNotDeployed=false 是必需的：该 goal 默认跳过「不参与 deploy 的项目」，
        # 而根工程（pom 打包）不参与 deploy → 不加该参数时 SBOM 根本不会生成（R4-CVE 实测踩坑）。
        run: |
          set -euo pipefail
          mvn -B -q -DskipTests -Dspotless.check.skip=true -Dcyclonedx.skip=false \
            -Dcyclonedx.skipNotDeployed=false \
            org.cyclonedx:cyclonedx-maven-plugin:makeAggregateBom
          test -s target/bom.json || { echo "::error::target/bom.json was not generated"; exit 1; }

      - name: Sanity-check the SBOM (published artifacts + dependency graph must be present)
        # 防止「SBOM 生成成功但内容为空/退化为空壳」导致 CVE 门禁静默失效：
        # 1) 4 个发布构件必须在 SBOM 中；2) 解析出的第三方依赖必须存在（缺失说明依赖图构建失败）；
        # 3) 组件总数下限兜底。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys

          with open('target/bom.json', encoding='utf-8') as fh:
              bom = json.load(fh)
          components = bom.get('components') or []
          names = {(c.get('group'), c.get('name')) for c in components}
          required = {('io.github.streammq', a) for a in (
              'streammq-core', 'streammq-redisson', 'streammq-spring-boot-starter', 'streammq-test')}
          missing = sorted(required - names)
          print(f"SBOM components: {len(components)}")
          if missing:
              print(f"::error::SBOM is missing published artifacts: {missing}")
              sys.exit(1)

          expected_deps = {('org.slf4j', 'slf4j-api'), ('org.redisson', 'redisson'),
                           ('com.fasterxml.jackson.core', 'jackson-databind'),
                           ('org.springframework.boot', 'spring-boot-starter')}
          found_deps = expected_deps & names
          print(f"Expected third-party dependencies found in the SBOM: {sorted(found_deps)}")
          if len(found_deps) < 3:
              print(f"::error::SBOM lists fewer expected third-party dependencies than expected "
                    f"(found {len(found_deps)} of {len(expected_deps)}) — dependency resolution likely failed")
              sys.exit(1)

          if len(components) < 20:
              print(f"::error::SBOM looks too small ({len(components)} components) — dependency resolution likely failed")
              sys.exit(1)
          print("SBOM sanity check OK: published artifacts and dependency components are present")
          PY

      - name: Filter the SBOM to the shipped dependency closure
        # 门禁范围 = 「发布构件实际带给使用方的依赖闭包」（R4-CVE）：
        # 聚合 SBOM 覆盖全部 reactor 项目（含 samples / 未发布模块），整份扫描会把示例应用的
        # Web 容器等无关依赖计入门禁。这里从 4 个发布构件出发做 BFS：
        #   · 跳过其它 streammq 模块（samples/diagnostics/kubernetes/bom 不对外发布）
        #   · 跳过 optional/excluded 组件（provided/optional 依赖由使用方自带，不属于本库的交付面）
        # 结果写入 target/bom-shipped.cdx.json 供 osv-scanner 扫描，并打印保留/剔除统计。
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import sys

          with open('target/bom.json', encoding='utf-8') as fh:
              bom = json.load(fh)
          components = bom.get('components') or []
          by_ref = {c['bom-ref']: c for c in components}
          deps = {e['ref']: (e.get('dependsOn') or []) for e in (bom.get('dependencies') or [])}
          published = {'streammq-core', 'streammq-redisson',
                       'streammq-spring-boot-starter', 'streammq-test'}
          roots = [r for r, c in by_ref.items()
                   if c.get('group') == 'io.github.streammq' and c.get('name') in published]
          if len(roots) != 4:
              print(f"::error::expected 4 published roots in the SBOM, found {len(roots)}: {roots}")
              sys.exit(1)

          kept = set()
          stack = list(roots)
          while stack:
              ref = stack.pop()
              if ref in kept:
                  continue
              component = by_ref.get(ref)
              if component is None:
                  continue
              if (component.get('group') == 'io.github.streammq'
                      and component.get('name') not in published
                      and ref not in roots):
                  continue
              if component.get('scope', 'required') in ('optional', 'excluded'):
                  continue
              kept.add(ref)
              stack.extend(deps.get(ref, []))

          shipped = dict(bom)
          shipped['components'] = [c for c in components if c['bom-ref'] in kept]
          shipped['dependencies'] = [e for e in (bom.get('dependencies') or [])
                                     if e['ref'] in kept]
          with open('target/bom-shipped.cdx.json', 'w', encoding='utf-8') as fh:
              json.dump(shipped, fh, ensure_ascii=False)

          names = sorted(f"{by_ref[r].get('name')}:{by_ref[r].get('version')}" for r in kept)
          print(f"Shipped closure: {len(kept)} components (aggregate SBOM has {len(components)})")
          print("Shipped components:")
          for name in names:
              print(f"  - {name}")
          PY

      - name: Download osv-scanner (pinned version)
        run: |
          set -euo pipefail
          curl -fsSL -o osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v2.6.0/osv-scanner_linux_amd64"
          # 供应链校验（必须）：该二进制是 CVE 硬门禁的判定执行体，未校验即等于把"是否阻断发布"
          # 交给一个可被替换的下载产物。SHA256 取自 GitHub Release 资产元数据的官方 digest
          # （v2.6.0 / osv-scanner_linux_amd64），校验失败立即中断。
          echo "ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108  osv-scanner" \
            | sha256sum -c -
          chmod +x osv-scanner
          # 冒烟：确保下载的二进制可执行且 CLI 可用（v2 是 cobra CLI，版本开关在不同小版本间
          # 可能是 `--version` 或 `version` 子命令，故按顺序容错，最后以 `--help` 兜底）。
          ./osv-scanner --version 2>/dev/null || ./osv-scanner version 2>/dev/null || ./osv-scanner --help > /dev/null

      - name: Scan the shipped SBOM with osv-scanner (hard gate)
        # 门禁口径（R4-CVE，与 OWASP 时代的 failBuildOnCVSS=7 对齐）：
        #   · 扫描对象是「发布构件实际带给使用方的依赖闭包」（上一步生成的 bom-shipped.cdx.json）
        #   · 任意 ≥7.0（High/Critical）的公告 → 门禁失败；<7.0 的公告打印但不阻断（观测面）
        #   · 完整 JSON 报告上传为构建产物，便于 triage
        # 说明：不使用 osv-scanner 的退出码直接判定——退出码 1 表示"发现任意级别公告"，
        # 会把 Medium/Low 也当作阻断，门禁会长期变红而失去可操作性。
        run: |
          set -euo pipefail
          rc=0
          ./osv-scanner scan source -L target/bom-shipped.cdx.json \
            --format json --output target/osv-report.json > /dev/null 2>&1 || rc=$?
          case "${rc}" in
            0|1)
              : # 0=未发现；1=发现（按严重度在下一步裁决）
              ;;
            128)
              echo "::error::osv-scanner found no packages in target/bom-shipped.cdx.json — the SBOM is empty or broken"
              exit 1
              ;;
            *)
              echo "::error::osv-scanner failed with exit code ${rc}"
              exit 1
              ;;
          esac
          python3 - <<'PY'
          import json
          import sys

          THRESHOLD = 7.0
          with open('target/osv-report.json', encoding='utf-8') as fh:
              report = json.load(fh)

          blocking = []
          informational = []
          for result in report.get('results', []):
              for pkg in result.get('packages', []):
                  name = pkg['package']['name']
                  version = pkg['package']['version']
                  for group in pkg.get('groups', []):
                      severity = float(group.get('max_severity') or 0)
                      ids = ', '.join(group.get('ids', []))
                      line = f"{severity:4.1f}  {name}:{version}  {ids}"
                      (blocking if severity >= THRESHOLD else informational).append(line)

          print(f"Shipped-closure vulnerability findings: {len(blocking) + len(informational)}"
                f" (blocking >= {THRESHOLD}: {len(blocking)})")
          for line in sorted(informational, reverse=True):
              print(f"  [info] {line}")
          for line in sorted(blocking, reverse=True):
              print(f"  [BLOCK] {line}")

          if blocking:
              print("::error::CVE gate failed: High/Critical advisories in the shipped dependency"
                    " closure — upgrade or document an explicit exception in SECURITY.md")
              sys.exit(1)
          print("CVE gate OK: no High/Critical advisories in the shipped dependency closure")
          PY

      - name: Upload SBOM + vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-sbom-and-vulnerability-report
          path: |
            target/bom.json
            target/bom-shipped.cdx.json
            target/osv-report.json
          if-no-files-found: warn

  test:
    name: Test (gate before publish)
    runs-on: ubuntu-latest
    # F-11：显式超时预算
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          # E-20：显式拦截 SNAPSHOT —— 中央仓库不接受 SNAPSHOT 版本，
          # 且 SNAPSHOT 会绕过「版本与标签一致」的语义（此前正则允许 `-SNAPSHOT` 后缀）。
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH (SNAPSHOT is not allowed)." >&2
            exit 1
          fi

      # F-1（前置断言）：workflow_dispatch 路径必须在**任何构建开始之前**就存在指向本次提交的 tag。
      # 与 publish job 中的同一断言重复一次，原因只是 fail-fast：test job 要跑 45 分钟全量 verify，
      # 缺 tag 时不应等到 publish 才失败。两处断言的命令与提示完全一致。
      - name: Assert release tag exists and points at HEAD (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION#v}"
          git fetch --tags --force
          if ! tag_commit="$(git rev-list -n 1 "${tag}" 2>/dev/null)"; then
            echo "::error::Tag ${tag} does not exist on the remote (or is not resolvable)."
            echo "::error::workflow_dispatch releases require the signed tag to exist BEFORE the run:"
            echo "::error::  git tag -s ${tag} -m \"Release ${tag}\" && git push origin ${tag}"
            echo "::error::请先创建并推送签名 tag，再重新触发本工作流。"
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          echo "tag=${tag} tag_commit=${tag_commit} head_commit=${head_commit}"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Tag ${tag} points at ${tag_commit}, but the workflow checked out ${head_commit}."
            echo "::error::请先创建并推送指向该提交的签名 tag；不要依赖工作流在发布时现场补 tag。"
            exit 1
          fi
          echo "Tag ${tag} exists and matches HEAD"

      # 发布门禁：单测 + 集成测试 + Spotless/JaCoCo 全部通过才允许进入 deploy job。
      # 此前发布通道直接 deploy -DskipTests，完全绕过质量门禁，属高危流程缺陷。
      # 注意必须显式 -Djacoco.check.skip=false：该开关默认 true，否则覆盖率门禁形同虚设。
      - name: Run full verify (unit + integration + coverage gate)
        run: mvn clean verify -B -Djacoco.check.skip=false

      # F-01：集成测试若因 Redis service 异常被整体跳过，mvn verify 仍会"绿色"通过。
      # 发布通道必须与 PR 通道同等强度：按模块下限 + 全局下限 + 跳过率上限三层校验。
      - name: Integration test tripwire (per-module floors, detect silent Redis-service breakage)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          files = glob.glob('**/failsafe-reports/*.xml', recursive=True)
          if not files:
              print("::error::no failsafe-reports/*.xml found — integration tests never ran")
              sys.exit(1)

          # 按模块聚合；streammq-samples 下的 8 个 sample 统一归入 streammq-samples/*
          stats = defaultdict(lambda: {"tests": 0, "skipped": 0})
          for path in files:
              p = path.replace("\\", "/")
              key = "streammq-samples/*" if p.startswith("streammq-samples/") else p.split("/")[0]
              root = ET.parse(path).getroot()
              stats[key]["tests"] += int(root.get("tests", 0))
              stats[key]["skipped"] += int(root.get("skipped", 0))

          rows = []
          total = skipped = 0
          for key in sorted(stats):
              t = stats[key]["tests"]
              s = stats[key]["skipped"]
              total += t
              skipped += s
              rows.append((key, t, s, t - s))

          print("Failsafe per-module inventory (executed = tests - skipped):")
          for key, t, s, e in rows:
              print(f"  {key}: executed={e} skipped={s} total={t}")
          print(f"Failsafe totals: tests={total} skipped={skipped} executed={total - skipped}")

          floors = {
              "streammq-redisson": 100,
              "streammq-spring-boot-starter": 30,
              "streammq-test": 40,
              "streammq-samples/*": 16,
          }
          failed = False
          for key, floor in floors.items():
              executed = (stats[key]["tests"] - stats[key]["skipped"]) if key in stats else 0
              if executed < floor:
                  print(f"::error::module '{key}' executed {executed} integration tests, below its floor {floor} "
                        "(likely cause: the Redis service container is unhealthy and ITs were silently skipped).")
                  failed = True

          global_executed = total - skipped
          if global_executed < 230:
              print(f"::error::integration tests executed below the global floor "
                    f"(executed={global_executed} < 230).")
              failed = True
          if skipped * 5 > total:
              print(f"::error::more than 20% of integration tests were skipped "
                    f"(skipped={skipped}/{total}).")
              failed = True

          if failed:
              print("Tripwire details (per module): "
                    + "; ".join(f"{k}: executed={e} skipped={s} total={t}" for k, t, s, e in rows))
              sys.exit(1)
          print("Tripwire OK: per-module floors, global floor and skip-rate limit are satisfied.")
          PY

      # 门禁：API 兼容性检查（japicmp）。
      # 探测 Maven Central 上已发布的上一版本；若存在（即非首个版本），
      # 对比当前源码构建产物与上一版本的二进制/源码兼容性，发现破坏性变更则阻断发布。
      # 首个公开版本（Central 无历史）时整步跳过（并显式输出 ran=false，由下方断言步骤区分「跳过」与「没跑」）。
      # 0.1.x 兼容策略：核心/发布模块（core/redisson/spring-boot-starter/test）的公开 API 由本门禁强制
      # 「二进制 + 源码」兼容；确需破坏性变更时走 CHANGELOG 的 Breaking Changes 流程并显式调整基线。
      # 注意：-pl 只能包含"实际发布集合"（core/redisson/spring-boot-starter/test）——
      # streammq-tracing-opentelemetry / streammq-diagnostics / streammq-spring-cloud-stream-binder
      # 被 excludeArtifacts 永久排除、Central 上永远没有旧版本，纳入后 japicmp 解析旧版本会直接失败
      #（根 POM 已显式 ignoreMissingOldVersion=false，解析不到即失败，不再静默跳过）。
      - name: API compatibility gate (japicmp vs previous release)
        id: japicmp
        shell: bash
        run: |
          set -euo pipefail
          metadata_url="https://repo1.maven.org/maven2/io/github/streammq/streammq-core/maven-metadata.xml"
          prev="$(curl -fsSL "${metadata_url}" 2>/dev/null | grep -oP '(?<=<release>)[^<]+' | head -1 || true)"
          if [[ -z "${prev}" ]]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "No previous release on Maven Central — first public release, API compatibility gate skipped."
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "Comparing API compatibility against previous release: ${prev}"
          mvn -pl streammq-core,streammq-redisson,streammq-spring-boot-starter,\
          streammq-test \
              -am verify \
              -Djapicmp.skip=false -Djapicmp.oldVersion="${prev}" \
              -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true -B \
              2>&1 | tee "${RUNNER_TEMP}/japicmp.log"

      # E-04 断言：japicmp 若被静默跳过（旧版本解析不到、模块被排除、只跑了少数模块），
      # 上面的 mvn 仍可能"绿色"，发布通道就会假绿。
      # 口径：N = 发布模块数 - 2（不含 parent/bom，二者为 pom 打包、由 japicmp 自动跳过）= 4，
      # 日志中至少出现 N 条 `Comparing <binary|source> compatibility`，或产出 ≥N 个 target/japicmp/*.xml 报告。
      - name: Assert japicmp actually compared every published module
        if: steps.japicmp.outputs.ran == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=4
          compared="$(grep -cE 'Comparing (binary|source) compatibility' "${RUNNER_TEMP}/japicmp.log" || true)"
          reports="$(find . -path '*/target/japicmp/*.xml' -type f | wc -l)"
          echo "japicmp 'Comparing' lines: ${compared}; target/japicmp/*.xml reports: ${reports}"
          if [ "${compared}" -lt "${expected}" ] && [ "${reports}" -lt "${expected}" ]; then
            echo "::error::japicmp compared fewer modules than expected (expected >= ${expected} of the 4 published"
            echo "::error::jar modules; 'Comparing' lines=${compared}, xml reports=${reports})."
            echo "::error::A silently skipped API-compatibility gate means a false green — investigate before publishing."
            exit 1
          fi
          echo "japicmp assertion OK"

      # 发布预检（staging smoke）——与 ci.yml 的 staging-smoke 对齐，做到真正隔离：
      # 只把"实际发布到 Central 的构件集合"（bom/core/redisson/spring-boot-starter/test）install 到
      # 隔离本地仓库（${RUNNER_TEMP}，不污染 ~/.m2）。若误把永不发布的构件混入发布集合/BOM，
      # 下面的使用方解析会真实失败，而不是被共享本地仓库里的"意外安装物"掩盖。
      - name: Install publishable modules into an isolated local repo (simulate staging)
        shell: bash
        run: |
          set -euo pipefail
          mvn install -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true \
            -Dmaven.repo.local="${RUNNER_TEMP}/streammq-release-staging-repo" \
            -pl streammq-bom,streammq-core,streammq-redisson,streammq-spring-boot-starter,streammq-test -am

      - name: Compile a consumer app against the BOM
        shell: bash
        run: |
          set -euo pipefail
          REPO="${RUNNER_TEMP}/streammq-release-staging-repo"
          # E-09：-N（非递归）避免 20 项目 reactor 上 help:evaluate 输出多行；tail -n1 兜底清洗
          VER="$(mvn -N help:evaluate -Dexpression=project.version -q -DforceStdout \
            -Dmaven.repo.local="${REPO}" | tail -n1)"
          mkdir -p /tmp/streammq-smoke/src/main/java/com/example
          cat > /tmp/streammq-smoke/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>streammq-smoke-consumer</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>io.github.streammq</groupId>
                  <artifactId>streammq-bom</artifactId>
                  <version>__SMQ_VER__</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-spring-boot-starter</artifactId>
              </dependency>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-core</artifactId>
              </dependency>
            </dependencies>
          </project>
          EOF
          sed -i "s/__SMQ_VER__/${VER}/" /tmp/streammq-smoke/pom.xml
          cat > /tmp/streammq-smoke/src/main/java/com/example/Smoke.java <<'EOF'
          package com.example;

          import io.github.streammq.core.message.Message;
          import io.github.streammq.core.message.MessageBuilder;
          import java.util.Map;

          /** 仅验证使用方视角下 BOM 可解析、公开 API 可编译引用。 */
          public final class Smoke {
              public static void main(String[] args) {
                  Message<Map<String, Object>> msg =
                          MessageBuilder.<Map<String, Object>>withTopic("smoke")
                                  .body(Map.of("ok", true))
                                  .withUserProperty("traceId", "t-001")
                                  .build();
                  System.out.println(msg.getTopic());
              }
          }
          EOF
          mvn -q -f /tmp/streammq-smoke/pom.xml clean compile \
            -Dmaven.repo.local="${REPO}"

          # F-4：隔离不彻底的两处缺口——① 上面的 compile 未离线，② 没有任何版本断言。
          # 于是从第二次发布起，若 BOM/属性漂移把依赖指回**上一版**，Maven 会从 Central（或隔离仓库里
          # 已 install 的旧物）解析成功、构建照样变绿（假绿），而字节其实来自旧版本。
          # 现按"使用方视角"列出实际解析到的 io.github.streammq:*，硬断言其版本全部 == 本次构建版本 VER。
          # 选择版本断言而非 `-o` 离线解析：隔离仓库是全新目录，`-o` 会连带要求所有插件/父 POM 都已在
          # 本地（失败信息与"版本漂移"混淆），而版本断言直接命中回归语义，且对 Central 回退同样有效。
          mvn -f /tmp/streammq-smoke/pom.xml dependency:list \
            -Dmaven.repo.local="${REPO}" -DincludeGroupIds=io.github.streammq -B \
            2>&1 | tee "${RUNNER_TEMP}/streammq-smoke-deps.log"
          python3 - "${RUNNER_TEMP}/streammq-smoke-deps.log" "${VER}" <<'PY'
          import re
          import sys

          log_path, expected = sys.argv[1], sys.argv[2]
          rows = []
          with open(log_path, encoding='utf-8', errors='replace') as fh:
              for line in fh:
                  for coord in re.findall(r'io\.github\.streammq:[^\s,]+', line):
                      parts = coord.split(':')
                      if len(parts) >= 4:
                          rows.append((parts[1], parts[3]))
          rows = sorted(set(rows))
          print(f"staging smoke resolved streammq artifacts: {rows}")
          if not rows:
              print("::error::staging smoke resolved NO io.github.streammq artifacts — the consumer resolve is broken")
              sys.exit(1)
          wrong = [(a, v) for a, v in rows if v != expected]
          if wrong:
              print(f"::error::staging smoke resolved streammq artifacts at the WRONG version"
                    f" (expected {expected}): {wrong}")
              print("::error::a stale version resolvable from Maven Central means the release would silently mix old binaries")
              sys.exit(1)
          missing = {'streammq-core', 'streammq-spring-boot-starter'} - {a for a, _ in rows}
          if missing:
              print(f"::error::staging smoke did not resolve expected artifacts: {sorted(missing)}")
              sys.exit(1)
          print(f"staging smoke version assertion OK: every io.github.streammq artifact is at {expected}")
          PY

      # 反向断言（与 ci.yml 的 staging-smoke 对齐）：excludeArtifacts 中的构件必须解析失败，
      # 防止 BOM / 发布清单再次漂移，让使用方依赖到"中央仓库永远不会存在"的构件。
      # 清单直接读自根 pom 的 central-publishing-maven-plugin <excludeArtifacts>，避免两处清单不一致。
      - name: Assert unpublished modules are NOT resolvable
        shell: bash
        run: |
          set -euo pipefail
          REPO="${RUNNER_TEMP}/streammq-release-staging-repo"
          VER="$(mvn -N help:evaluate -Dexpression=project.version -q -DforceStdout \
            -Dmaven.repo.local="${REPO}" | tail -n1)"
          excluded="$(grep -oP '(?<=<excludeArtifacts>)[^<]+' pom.xml)"
          if [ -z "${excluded}" ]; then
            echo "::error::could not read <excludeArtifacts> from pom.xml — cannot verify the unpublished set"
            exit 1
          fi
          IFS=',' read -r -a artifacts <<< "${excluded}"
          for art in "${artifacts[@]}"; do
            if mvn -q dependency:get -Dartifact="io.github.streammq:${art}:${VER}" \
                 -Dmaven.repo.local="${REPO}" >/dev/null 2>&1; then
              echo "::error::${art} resolved from the staging repo but is NOT in the published set —"
              echo "::error::keep the BOM and the release excludeArtifacts list consistent."
              exit 1
            fi
            echo "OK: ${art} is correctly absent from the published set"
          done

      # E-19：缓存 NVD 库目录（与下方 -DdataDirectory 指向同一路径），避免每次发布全量重建数据库。
      - name: Cache OWASP dependency-check data directory (NVD database)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-data-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      # 发布前置（E-03/F-2）：默认 CVE 硬门禁已作为本工作流的 sbom-scan job 执行（CycloneDX SBOM +
      # osv-scanner，与 ci.yml 同命令/同版本，不需要任何 secrets，且 publish 依赖它）；
      # 本步骤的 OWASP/NVD 深扫为**增强**：仅当 secrets.NVD_API_KEY 存在时执行，
      # 否则显式跳过（workflow 的 secrets 不能用于 job-level if，只能在 step 内判断环境变量并 skip）。
      # 不再留下「未配置密钥 → NVD 408/429 → 永久红」的矛盾说明。
      # E-02：必须显式传 nvdApiKeyEnvironmentVariable/nvdValidForHours/dataDirectory ——
      # 插件参数无默认值，只设置 env 而不传参等于插件永远不读密钥。
      # E-19：-pl 收敛到发布集 + 显式 dataDirectory + actions/cache 缓存 NVD 库，避免逐模块重建。
      - name: Dependency vulnerability scan (OWASP deep scan, runs only when NVD_API_KEY is set)
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::notice::NVD_API_KEY is not configured — skipping the OWASP/NVD deep scan (release is not blocked)."
            echo "::notice::The default CVE hard gate is this workflow's sbom-scan job (CycloneDX + osv-scanner), which needs no secrets."
            exit 0
          fi
          DATA_DIR="${HOME}/.cache/dependency-check"
          mkdir -p "${DATA_DIR}"
          for attempt in 1 2 3; do
            if mvn verify -B -Dowasp.skip=false -DskipTests -Dspotless.check.skip=true \
                 -pl streammq-bom,streammq-core,streammq-redisson,streammq-spring-boot-starter,streammq-test \
                 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
                 -DnvdValidForHours=24 \
                 -DdataDirectory="${DATA_DIR}"; then
              exit 0
            fi
            echo "::warning::OWASP scan attempt ${attempt} failed (NVD rate limits are common); retrying..."
            sleep 30
          done
          echo "::error::OWASP dependency scan failed after 3 attempts"
          exit 1

  publish:
    name: Publish to Maven Central
    # F-2：发布前必须同时通过 test（质量门禁）、guard（发布集一致性）与 sbom-scan（keyless CVE 硬门禁）。
    needs: [test, guard, sbom-scan]
    runs-on: ubuntu-latest
    # F-11/F-5：显式超时预算。本 job 要跑**两次**全量 reactor 构建
    #（`mvn clean verify` 含真实 Redis 集成测试 + javadoc/sources，随后 `mvn clean deploy` 再全量跑
    #  packaging + GPG 签名 + Portal 上传），45 分钟是单次构建级的预算、容易在慢 runner 上被截断；
    # 提到 90 分钟。真正的优化（deploy 复用 verify 产物需要放开 staging 上传语义）留给后续，
    # 这里不改变「被测试的 = 被发布的」口径。
    timeout-minutes: 90
    # E-01：publish job 也必须提供 Redis —— 下方 `mvn clean verify -Djacoco.check.skip=false`
    # 会跑发布集的覆盖率门禁，而 redisson 的阈值（LINE 0.60 / BRANCH 0.50）是含 IT 标定的：
    # 没有 Redis 时 IT 全部跳过 → 覆盖率跌破阈值 → BUILD FAILURE → deploy 永不执行。
    # 配置与 test job 完全一致，保证两个 job 的门禁口径相同。
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate and extract release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          # E-20：拦截 SNAPSHOT（中央仓库不接受；且会绕过发布语义）
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH (SNAPSHOT is not allowed)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 发布门禁：标签必须指向本次工作流所检出的提交。
      # 若标签先于修复提交打出（"先打 tag 再改代码"），这里的校验会失败，避免把
      # 与标签内容不一致的二进制发布到 Maven Central（中央仓库构件不可变，无法回滚）。
      - name: Verify tag points at the checked-out commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          echo "tag=${RELEASE_TAG} tag_commit=${tag_commit}"
          echo "head_commit=${head_commit}"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} points at ${tag_commit}, but the workflow checked out ${head_commit}."
            echo "::error::The tag was created before the latest commits. Delete and re-create the tag on the"
            echo "::error::intended commit, then re-run the release:"
            echo "::error::  git tag -d ${RELEASE_TAG} && git push origin :refs/tags/${RELEASE_TAG}"
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} matches HEAD"

      # F-1：`workflow_dispatch` 路径此前**完全没有** tag 校验 —— 上方断言按 `github.ref` 过滤，
      # 只在 tag 事件生效；dispatch 时 tag 由 Create GitHub Release 现场创建（见文件末尾），
      # 于是「上传到 Central 的字节」绑定不到任何已校验的 tag / commit。
      # 现要求在构建前就存在一个指向本次检出提交的 tag：先 --force 拉取远端 tag（checkout 默认不取 tag），
      # 再断言 `v${VERSION}` 可解析且其 commit == HEAD。本地/远端不一致时这里硬失败，
      # 提示维护者先创建并推送签名 tag，而不是发布时由流水线补 tag。
      - name: Assert release tag exists and points at HEAD (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --tags --force
          if ! tag_commit="$(git rev-list -n 1 "${tag}" 2>/dev/null)"; then
            echo "::error::Tag ${tag} does not exist on the remote (or is not resolvable)."
            echo "::error::workflow_dispatch releases require the signed tag to exist BEFORE the run:"
            echo "::error::  git tag -s ${tag} -m \"Release ${tag}\" && git push origin ${tag}"
            echo "::error::请先创建并推送签名 tag，再重新触发本工作流。"
            exit 1
          fi
          head_commit="$(git rev-parse HEAD)"
          echo "tag=${tag} tag_commit=${tag_commit} head_commit=${head_commit}"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Tag ${tag} points at ${tag_commit}, but the workflow checked out ${head_commit}."
            echo "::error::请先创建并推送指向该提交的签名 tag；不要依赖工作流在发布时现场补 tag。"
            exit 1
          fi
          echo "Tag ${tag} exists and matches HEAD"

      - name: Set project version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      # 反向断言：streammq-bom 无 <parent>（独立 POM），一旦 versions:set 未覆盖到它，
      # 升版后仍会以旧版本发布 —— 使用方 import streammq-bom:<新版本> 永远解析失败。
      # 该断言把"静默漂移"变成发布通道上的硬失败。
      - name: Assert BOM version was rewritten
        shell: bash
        run: |
          set -euo pipefail
          bom_version="$(mvn -N -f streammq-bom/pom.xml help:evaluate \
            -Dexpression=project.version -q -DforceStdout | tail -n1)"
          if [ "${bom_version}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::streammq-bom version is ${bom_version}, expected ${{ steps.version.outputs.version }}"
            exit 1
          fi
          echo "streammq-bom version OK: ${bom_version}"

      # streammq-bom 独立于 parent、内部以属性硬编码 streammq.version；
      # versions:set 不会更新该属性，需单独 set-property，否则 BOM 会指向不存在的旧版本。
      - name: Sync BOM version property
        run: mvn versions:set-property -Dproperty=streammq.version -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # F-3：BOM 的 <version> 已被改写（见上方断言），但其 dependencyManagement 的四条
      # io.github.streammq 依赖版本全部来自 <streammq.version> 属性（streammq-bom/pom.xml L58 定义，
      # L71/76/81/91 引用）。`versions:set` 不动属性，若 set-property 漏改/改错，BOM 会把
      # core/redisson/starter/test 指向**上一版**；而旧版本在 Central 存在 → 使用方 import 新 BOM 后
      # 静默混用旧二进制（staging smoke 的"能解析"也照样成立，不会变红）。
      # 本断言必须放在 set-property 之后（放在 versions:set 之后会恒失败），按 BOM 自身求值该属性并硬比对。
      - name: Assert BOM streammq.version property was rewritten
        shell: bash
        run: |
          set -euo pipefail
          bom_property="$(mvn -N -f streammq-bom/pom.xml help:evaluate \
            -Dexpression=streammq.version -q -DforceStdout | tail -n1)"
          if [ "${bom_property}" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::streammq-bom property streammq.version is ${bom_property}, expected ${{ steps.version.outputs.version }}"
            echo "::error::the BOM would point consumers at the previous release's binaries (silently mixed versions)."
            exit 1
          fi
          echo "streammq-bom streammq.version OK: ${bom_property}"

      # 发布门禁（R-39）：versions:set 改写了全部 pom，此前 test job 验证的是"旧版本号"的产物。
      # 必须对"即将发布的这份产物"重新跑一次完整 verify，保证“被测试的 = 被发布的”。
      # E-01：本 job 已提供 Redis service，集成测试与覆盖率门禁（-Djacoco.check.skip=false）口径与 test job 一致。
      - name: Re-verify after version rewrite (tested bits == published bits)
        run: mvn clean verify -B -Djacoco.check.skip=false

      # 测试已在上一步通过，此处跳过测试仅执行打包与 deploy（同一份版本号产物）
      # GPG 非交互签名：pom 的 gpg profile 已声明 `--pinentry-mode loopback`（gpg 2.1+ 在无 tty 的
      # runner 上必须显式 loopback 才接受口令，否则签名步骤直接失败、发布中断）。此处显式把
      # setup-java 导出的 MAVEN_GPG_PASSPHRASE 以 Maven 属性传入（插件参数名为 gpg.passphrase），
      # 避免依赖"插件是否恰好读取同名环境变量"的隐式约定。
      - name: Build and deploy to Maven Central
        run: mvn clean deploy -DskipTests -Pgpg -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE"
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # E-13：资产清单只包含真实产出的文件 —— BOM 为 pom 打包，不产出 target/*.pom，
      # 直接挂各模块 target/ 下的产物；fail_on_unmatched_files: true 让清单与实际产物不一致时
      # 立即失败（此前缺失资产会被静默忽略）。
      # 发布清单 == Central 可解析的构件集合，共 **6 个**：parent / bom / core / redisson / starter / test。
      # `streammq-parent`（packaging=pom）随 deploy 发布到 Central、供下游以 <parent> 继承
      #（无 jar/sources/javadoc 产物，故不列入 Release 资产文件）；`streammq-bom` 为 pom 打包，
      # 其资产就是源 POM 文件本身。
      # tracing/diagnostics/spring-cloud-stream-binder/kubernetes 被 excludeArtifacts 排除、
      # Central 不可解析，若挂到 Release 资产会让使用方误以为它们可从 Central 解析，故**不列入**。
      - name: Create GitHub Release
        # 供应链加固：第三方 action 固定到 v2 对应的完整 commit SHA（renovate/dependabot 可识别 # v2）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: StreamMQ ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # F-7：根 POM / BOM 均为 <autoPublish>false</autoPublish> + <waitUntil>validated</waitUntil>——
          # `mvn deploy` 只把 staging 部署推进到 Central Portal 的 **validated** 状态，构件要等维护者
          # 在 Portal 点 "Publish" 后才真正进入 Central。若 Release 页面此时宣称"可用"，用户会解析失败。
          # 选择仅注入醒目提示（不做 Portal 状态软校验）：Portal 的部署状态查询需要额外的 API 凭据/令牌，
          # 现有 secrets 未提供，且状态轮询会引入新的外部依赖与不稳定面；提示 + 人工 Publish 步骤的
          # 成本更低、语义明确（生成说明会追加在 body 之后）。
          body: |
            > [!IMPORTANT]
            > **构件尚未在 Maven Central 可解析（awaiting manual Publish）**
            >
            > `streammq-parent` / `streammq-bom` / `streammq-core` / `streammq-redisson` /
            > `streammq-spring-boot-starter` / `streammq-test` 已上传到
            > [Central Portal](https://central.sonatype.com/) 的 staging 部署，当前状态为
            > **validated（已校验、待发布）**。需维护者人工点击 **Publish** 之后，用户才能从
            > Maven Central 解析本版本（本仓库 `<autoPublish>false</autoPublish>`）。
            > 在此之前请勿在 README / 文档 / 下游 POM 中引用该版本坐标。
            >
            > The artifacts are **not yet resolvable from Maven Central**: the staging deployment is
            > **validated** and requires a maintainer to click **Publish** in the Central Portal.
            > Do not reference this version's coordinates until the deployment is published.
          fail_on_unmatched_files: true
          files: |
            streammq-bom/pom.xml
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-sources.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}-sources.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}-sources.jar
            streammq-spring-boot-starter/target/streammq-spring-boot-starter-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}-sources.jar
            streammq-test/target/streammq-test-${{ steps.version.outputs.version }}-javadoc.jar
