name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (for example 1.2.3 or v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

# E-14/E-25：发布流程**不取消**进行中的运行（cancel-in-progress: false），
# 中央仓库构件不可变，任何一次发布都必须完整走完或人工干预，不能被并发触发静默掐断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (gate before publish)
    runs-on: ubuntu-latest
    # F-11：显式超时预算
    timeout-minutes: 45
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Validate release version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          # E-20：显式拦截 SNAPSHOT —— 中央仓库不接受 SNAPSHOT 版本，
          # 且 SNAPSHOT 会绕过「版本与标签一致」的语义（此前正则允许 `-SNAPSHOT` 后缀）。
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH (SNAPSHOT is not allowed)." >&2
            exit 1
          fi

      # 发布门禁：单测 + 集成测试 + Spotless/JaCoCo 全部通过才允许进入 deploy job。
      # 此前发布通道直接 deploy -DskipTests，完全绕过质量门禁，属高危流程缺陷。
      # 注意必须显式 -Djacoco.check.skip=false：该开关默认 true，否则覆盖率门禁形同虚设。
      - name: Run full verify (unit + integration + coverage gate)
        run: mvn clean verify -B -Djacoco.check.skip=false

      # F-01：集成测试若因 Redis service 异常被整体跳过，mvn verify 仍会"绿色"通过。
      # 发布通道必须与 PR 通道同等强度：按模块下限 + 全局下限 + 跳过率上限三层校验。
      - name: Integration test tripwire (per-module floors, detect silent Redis-service breakage)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET
          from collections import defaultdict

          files = glob.glob('**/failsafe-reports/*.xml', recursive=True)
          if not files:
              print("::error::no failsafe-reports/*.xml found — integration tests never ran")
              sys.exit(1)

          # 按模块聚合；streammq-samples 下的 8 个 sample 统一归入 streammq-samples/*
          stats = defaultdict(lambda: {"tests": 0, "skipped": 0})
          for path in files:
              p = path.replace("\\", "/")
              key = "streammq-samples/*" if p.startswith("streammq-samples/") else p.split("/")[0]
              root = ET.parse(path).getroot()
              stats[key]["tests"] += int(root.get("tests", 0))
              stats[key]["skipped"] += int(root.get("skipped", 0))

          rows = []
          total = skipped = 0
          for key in sorted(stats):
              t = stats[key]["tests"]
              s = stats[key]["skipped"]
              total += t
              skipped += s
              rows.append((key, t, s, t - s))

          print("Failsafe per-module inventory (executed = tests - skipped):")
          for key, t, s, e in rows:
              print(f"  {key}: executed={e} skipped={s} total={t}")
          print(f"Failsafe totals: tests={total} skipped={skipped} executed={total - skipped}")

          floors = {
              "streammq-redisson": 100,
              "streammq-spring-boot-starter": 30,
              "streammq-test": 40,
              "streammq-samples/*": 16,
          }
          failed = False
          for key, floor in floors.items():
              executed = (stats[key]["tests"] - stats[key]["skipped"]) if key in stats else 0
              if executed < floor:
                  print(f"::error::module '{key}' executed {executed} integration tests, below its floor {floor} "
                        "(likely cause: the Redis service container is unhealthy and ITs were silently skipped).")
                  failed = True

          global_executed = total - skipped
          if global_executed < 230:
              print(f"::error::integration tests executed below the global floor "
                    f"(executed={global_executed} < 230).")
              failed = True
          if skipped * 5 > total:
              print(f"::error::more than 20% of integration tests were skipped "
                    f"(skipped={skipped}/{total}).")
              failed = True

          if failed:
              print("Tripwire details (per module): "
                    + "; ".join(f"{k}: executed={e} skipped={s} total={t}" for k, t, s, e in rows))
              sys.exit(1)
          print("Tripwire OK: per-module floors, global floor and skip-rate limit are satisfied.")
          PY

      # 门禁：API 兼容性检查（japicmp）。
      # 探测 Maven Central 上已发布的上一版本；若存在（即非首个版本），
      # 对比当前源码构建产物与上一版本的二进制/源码兼容性，发现破坏性变更则阻断发布。
      # 首个公开版本（Central 无历史）时整步跳过（并显式输出 ran=false，由下方断言步骤区分「跳过」与「没跑」）。
      # 0.1.x 兼容策略：核心/发布模块（core/redisson/spring-boot-starter/test）的公开 API 由本门禁强制
      # 「二进制 + 源码」兼容；确需破坏性变更时走 CHANGELOG 的 Breaking Changes 流程并显式调整基线。
      # 注意：-pl 只能包含"实际发布集合"（core/redisson/spring-boot-starter/test）——
      # streammq-tracing-opentelemetry / streammq-diagnostics / streammq-spring-cloud-stream-binder
      # 被 excludeArtifacts 永久排除、Central 上永远没有旧版本，纳入后 japicmp 解析旧版本会直接失败
      #（根 POM 已显式 ignoreMissingOldVersion=false，解析不到即失败，不再静默跳过）。
      - name: API compatibility gate (japicmp vs previous release)
        id: japicmp
        shell: bash
        run: |
          set -euo pipefail
          metadata_url="https://repo1.maven.org/maven2/io/github/streammq/streammq-core/maven-metadata.xml"
          prev="$(curl -fsSL "${metadata_url}" 2>/dev/null | grep -oP '(?<=<release>)[^<]+' | head -1 || true)"
          if [[ -z "${prev}" ]]; then
            echo "ran=false" >> "$GITHUB_OUTPUT"
            echo "No previous release on Maven Central — first public release, API compatibility gate skipped."
            exit 0
          fi
          echo "ran=true" >> "$GITHUB_OUTPUT"
          echo "Comparing API compatibility against previous release: ${prev}"
          mvn -pl streammq-core,streammq-redisson,streammq-spring-boot-starter,\
          streammq-test \
              -am verify \
              -Djapicmp.skip=false -Djapicmp.oldVersion="${prev}" \
              -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true -B \
              2>&1 | tee "${RUNNER_TEMP}/japicmp.log"

      # E-04 断言：japicmp 若被静默跳过（旧版本解析不到、模块被排除、只跑了少数模块），
      # 上面的 mvn 仍可能"绿色"，发布通道就会假绿。
      # 口径：N = 发布模块数 - 2（不含 parent/bom，二者为 pom 打包、由 japicmp 自动跳过）= 4，
      # 日志中至少出现 N 条 `Comparing <binary|source> compatibility`，或产出 ≥N 个 target/japicmp/*.xml 报告。
      - name: Assert japicmp actually compared every published module
        if: steps.japicmp.outputs.ran == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=4
          compared="$(grep -cE 'Comparing (binary|source) compatibility' "${RUNNER_TEMP}/japicmp.log" || true)"
          reports="$(find . -path '*/target/japicmp/*.xml' -type f | wc -l)"
          echo "japicmp 'Comparing' lines: ${compared}; target/japicmp/*.xml reports: ${reports}"
          if [ "${compared}" -lt "${expected}" ] && [ "${reports}" -lt "${expected}" ]; then
            echo "::error::japicmp compared fewer modules than expected (expected >= ${expected} of the 4 published"
            echo "::error::jar modules; 'Comparing' lines=${compared}, xml reports=${reports})."
            echo "::error::A silently skipped API-compatibility gate means a false green — investigate before publishing."
            exit 1
          fi
          echo "japicmp assertion OK"

      # 发布预检（staging smoke）——与 ci.yml 的 staging-smoke 对齐，做到真正隔离：
      # 只把"实际发布到 Central 的构件集合"（bom/core/redisson/spring-boot-starter/test）install 到
      # 隔离本地仓库（${RUNNER_TEMP}，不污染 ~/.m2）。若误把永不发布的构件混入发布集合/BOM，
      # 下面的使用方解析会真实失败，而不是被共享本地仓库里的"意外安装物"掩盖。
      - name: Install publishable modules into an isolated local repo (simulate staging)
        shell: bash
        run: |
          set -euo pipefail
          mvn install -DskipTests -Dspotless.check.skip=true -Djacoco.check.skip=true \
            -Dmaven.repo.local="${RUNNER_TEMP}/streammq-release-staging-repo" \
            -pl streammq-bom,streammq-core,streammq-redisson,streammq-spring-boot-starter,streammq-test -am

      - name: Compile a consumer app against the BOM
        shell: bash
        run: |
          set -euo pipefail
          REPO="${RUNNER_TEMP}/streammq-release-staging-repo"
          # E-09：-N（非递归）避免 20 项目 reactor 上 help:evaluate 输出多行；tail -n1 兜底清洗
          VER="$(mvn -N help:evaluate -Dexpression=project.version -q -DforceStdout \
            -Dmaven.repo.local="${REPO}" | tail -n1)"
          mkdir -p /tmp/streammq-smoke/src/main/java/com/example
          cat > /tmp/streammq-smoke/pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.example</groupId>
            <artifactId>streammq-smoke-consumer</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>21</maven.compiler.release>
            </properties>
            <dependencyManagement>
              <dependencies>
                <dependency>
                  <groupId>io.github.streammq</groupId>
                  <artifactId>streammq-bom</artifactId>
                  <version>__SMQ_VER__</version>
                  <type>pom</type>
                  <scope>import</scope>
                </dependency>
              </dependencies>
            </dependencyManagement>
            <dependencies>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-spring-boot-starter</artifactId>
              </dependency>
              <dependency>
                <groupId>io.github.streammq</groupId>
                <artifactId>streammq-core</artifactId>
              </dependency>
            </dependencies>
          </project>
          EOF
          sed -i "s/__SMQ_VER__/${VER}/" /tmp/streammq-smoke/pom.xml
          cat > /tmp/streammq-smoke/src/main/java/com/example/Smoke.java <<'EOF'
          package com.example;

          import io.github.streammq.core.message.Message;
          import io.github.streammq.core.message.MessageBuilder;
          import java.util.Map;

          /** 仅验证使用方视角下 BOM 可解析、公开 API 可编译引用。 */
          public final class Smoke {
              public static void main(String[] args) {
                  Message<Map<String, Object>> msg =
                          MessageBuilder.<Map<String, Object>>withTopic("smoke")
                                  .body(Map.of("ok", true))
                                  .withUserProperty("traceId", "t-001")
                                  .build();
                  System.out.println(msg.getTopic());
              }
          }
          EOF
          mvn -q -f /tmp/streammq-smoke/pom.xml clean compile \
            -Dmaven.repo.local="${REPO}"

      # 反向断言（与 ci.yml 的 staging-smoke 对齐）：excludeArtifacts 中的构件必须解析失败，
      # 防止 BOM / 发布清单再次漂移，让使用方依赖到"中央仓库永远不会存在"的构件。
      # 清单直接读自根 pom 的 maven-deploy-plugin <excludeArtifacts>，避免两处清单不一致。
      - name: Assert unpublished modules are NOT resolvable
        shell: bash
        run: |
          set -euo pipefail
          REPO="${RUNNER_TEMP}/streammq-release-staging-repo"
          VER="$(mvn -N help:evaluate -Dexpression=project.version -q -DforceStdout \
            -Dmaven.repo.local="${REPO}" | tail -n1)"
          excluded="$(grep -oP '(?<=<excludeArtifacts>)[^<]+' pom.xml)"
          if [ -z "${excluded}" ]; then
            echo "::error::could not read <excludeArtifacts> from pom.xml — cannot verify the unpublished set"
            exit 1
          fi
          IFS=',' read -r -a artifacts <<< "${excluded}"
          for art in "${artifacts[@]}"; do
            if mvn -q dependency:get -Dartifact="io.github.streammq:${art}:${VER}" \
                 -Dmaven.repo.local="${REPO}" >/dev/null 2>&1; then
              echo "::error::${art} resolved from the staging repo but is NOT in the published set —"
              echo "::error::keep the BOM and the release excludeArtifacts list consistent."
              exit 1
            fi
            echo "OK: ${art} is correctly absent from the published set"
          done

      # E-19：缓存 NVD 库目录（与下方 -DdataDirectory 指向同一路径），避免每次发布全量重建数据库。
      - name: Cache OWASP dependency-check data directory (NVD database)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/dependency-check
          key: dependency-check-data-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: |
            dependency-check-data-${{ runner.os }}-

      # 发布前置（E-03）：默认 CVE 硬门禁在 CI 的 sbom-scan job（CycloneDX SBOM + osv-scanner，
      # 不需要任何 secrets）；本步骤的 OWASP/NVD 深扫为**增强**：仅当 secrets.NVD_API_KEY 存在时执行，
      # 否则显式跳过（workflow 的 secrets 不能用于 job-level if，只能在 step 内判断环境变量并 skip）。
      # 不再留下「未配置密钥 → NVD 408/429 → 永久红」的矛盾说明。
      # E-02：必须显式传 nvdApiKeyEnvironmentVariable/nvdValidForHours/dataDirectory ——
      # 插件参数无默认值，只设置 env 而不传参等于插件永远不读密钥。
      # E-19：-pl 收敛到发布集 + 显式 dataDirectory + actions/cache 缓存 NVD 库，避免逐模块重建。
      - name: Dependency vulnerability scan (OWASP deep scan, runs only when NVD_API_KEY is set)
        shell: bash
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ -z "${NVD_API_KEY:-}" ]; then
            echo "::notice::NVD_API_KEY is not configured — skipping the OWASP/NVD deep scan (release is not blocked)."
            echo "::notice::The default CVE hard gate is CI's sbom-scan job (CycloneDX + osv-scanner), which needs no secrets."
            exit 0
          fi
          DATA_DIR="${HOME}/.cache/dependency-check"
          mkdir -p "${DATA_DIR}"
          for attempt in 1 2 3; do
            if mvn verify -B -Dowasp.skip=false -DskipTests -Dspotless.check.skip=true \
                 -pl streammq-bom,streammq-core,streammq-redisson,streammq-spring-boot-starter,streammq-test \
                 -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
                 -DnvdValidForHours=24 \
                 -DdataDirectory="${DATA_DIR}"; then
              exit 0
            fi
            echo "::warning::OWASP scan attempt ${attempt} failed (NVD rate limits are common); retrying..."
            sleep 30
          done
          echo "::error::OWASP dependency scan failed after 3 attempts"
          exit 1

  publish:
    name: Publish to Maven Central
    needs: test
    runs-on: ubuntu-latest
    # F-11：显式超时预算
    timeout-minutes: 45
    # E-01：publish job 也必须提供 Redis —— 下方 `mvn clean verify -Djacoco.check.skip=false`
    # 会跑发布集的覆盖率门禁，而 redisson 的阈值（LINE 0.60 / BRANCH 0.50）是含 IT 标定的：
    # 没有 Redis 时 IT 全部跳过 → 覆盖率跌破阈值 → BUILD FAILURE → deploy 永不执行。
    # 配置与 test job 完全一致，保证两个 job 的门禁口径相同。
    services:
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Validate and extract release version
        id: version
        shell: bash
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_REF#v}"
          # E-20：拦截 SNAPSHOT（中央仓库不接受；且会绕过发布语义）
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || [[ "$version" == *SNAPSHOT* ]]; then
            echo "Invalid release version '$RELEASE_REF'. Expected MAJOR.MINOR.PATCH (SNAPSHOT is not allowed)." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # 发布门禁：标签必须指向本次工作流所检出的提交。
      # 若标签先于修复提交打出（"先打 tag 再改代码"），这里的校验会失败，避免把
      # 与标签内容不一致的二进制发布到 Maven Central（中央仓库构件不可变，无法回滚）。
      - name: Verify tag points at the checked-out commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          head_commit="$(git rev-parse HEAD)"
          echo "tag=${RELEASE_TAG} tag_commit=${tag_commit}"
          echo "head_commit=${head_commit}"
          if [[ "${tag_commit}" != "${head_commit}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} points at ${tag_commit}, but the workflow checked out ${head_commit}."
            echo "::error::The tag was created before the latest commits. Delete and re-create the tag on the"
            echo "::error::intended commit, then re-run the release:"
            echo "::error::  git tag -d ${RELEASE_TAG} && git push origin :refs/tags/${RELEASE_TAG}"
            exit 1
          fi
          echo "Tag ${RELEASE_TAG} matches HEAD"

      - name: Set project version
        run: mvn versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # streammq-bom 独立于 parent、内部以属性硬编码 streammq.version；
      # versions:set 不会更新该属性，需单独 set-property，否则 BOM 会指向不存在的旧版本。
      - name: Sync BOM version property
        run: mvn versions:set-property -Dproperty=streammq.version -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false

      # 发布门禁（R-39）：versions:set 改写了全部 pom，此前 test job 验证的是"旧版本号"的产物。
      # 必须对"即将发布的这份产物"重新跑一次完整 verify，保证“被测试的 = 被发布的”。
      # E-01：本 job 已提供 Redis service，集成测试与覆盖率门禁（-Djacoco.check.skip=false）口径与 test job 一致。
      - name: Re-verify after version rewrite (tested bits == published bits)
        run: mvn clean verify -B -Djacoco.check.skip=false

      # 测试已在上一步通过，此处跳过测试仅执行打包与 deploy（同一份版本号产物）
      - name: Build and deploy to Maven Central
        run: mvn clean deploy -DskipTests -Pgpg
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      # E-13：资产清单只包含真实产出的文件 —— BOM 为 pom 打包，不产出 target/*.pom，
      # 直接挂各模块 target/ 下的产物；fail_on_unmatched_files: true 让清单与实际产物不一致时
      # 立即失败（此前缺失资产会被静默忽略）。
      # 注：tracing/diagnostics/spring-cloud-stream-binder 三个模块被 excludeArtifacts 排除、
      # 不会发布到 Central，其 target 产物（若存在）也不属于发布资产，故不再列入。
      - name: Create GitHub Release
        # 供应链加固：第三方 action 固定到 v2 对应的完整 commit SHA（renovate/dependabot 可识别 # v2）
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: StreamMQ ${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            streammq-bom/pom.xml
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-sources.jar
            streammq-core/target/streammq-core-${{ steps.version.outputs.version }}-javadoc.jar
            streammq-redisson/target/streammq-redisson-${{ steps.version.outputs.version }}.jar
