name: Benchmark

# 手动触发的 JMH 基准任务：结果用于回填 README 性能基准章节（历史数字为旧实现测得，待本任务重新生成）。
on:
  workflow_dispatch:

# 最小权限原则：基准任务只需读取仓库内容
permissions:
  contents: read

jobs:
  benchmark:
    name: JMH Benchmarks
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # 先编译基准模块及其上游依赖（exec:java 直接调用目标不会触发依赖构建）
      - name: Build benchmark module and dependencies (skip tests)
        run: mvn -B -pl streammq-benchmark -am test-compile -DskipTests

      # 基准准备/清理含 flushdb（Testcontainers 独占实例 + 显式 allowFlush 授权）；
      # fork/iteration 参数由各 Benchmark 类注解决定，此处不调整。
      # 必须用 exec:exec：JMH @Fork 依赖真实子进程的 java.class.path，exec:java 会导致
      # fork 进程找不到 ForkedMain 而失败。
      - name: Run JMH benchmarks (template / serialization / consumer)
        run: >-
          mvn -B -Pbenchmark -pl streammq-benchmark
          exec:exec@benchmark-template
          exec:exec@benchmark-serialization
          exec:exec@benchmark-consumer
          -Dstreammq.benchmark.allowFlush=true

      - name: Collect JMH result files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          found=0
          # JMH 以 ResultFormatType.JSON 输出 jmh-*.json（此前 glob 写的是 jmh*.txt，导致产物恒为空）
          while IFS= read -r -d '' f; do
            cp "$f" benchmark-results/
            found=1
          done < <(find streammq-benchmark/target -maxdepth 1 -type f \
                     \( -name 'jmh*.json' -o -name 'jmh*.txt' \) -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no jmh*.json result files produced by benchmarks"
            exit 1
          fi
          ls -la benchmark-results

      # 性能回归门禁：调用仓库内置比对脚本（此前脚本存在但无人调用，自动保护仅有"产物存在"）。
      # 基线 bootstrap：benchmark-baseline.json 目前为空 {}，首次发布后才回填真实基线；
      # 基线缺失/为空时只提示、不失败，避免误拦；基线就绪后由脚本按阈值判定并阻断回归。
      - name: Check benchmark regression vs baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="streammq-benchmark/benchmark-baseline.json"
          has_baseline=false
          if [ -f "$baseline" ] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); d=d.get("benchmarks", d) if isinstance(d, dict) else d; sys.exit(0 if d else 1)' "$baseline"; then
            has_baseline=true
          fi
          if [ "$has_baseline" != true ]; then
            echo "::notice::No benchmark baseline yet (${baseline} absent, empty or unreadable) — regression comparison skipped. The baseline is bootstrapped after the first release."
            exit 0
          fi
          python3 streammq-benchmark/scripts/check_benchmark_regression.py \
            --current 'benchmark-results/jmh*.json' \
            --baseline "$baseline"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn
