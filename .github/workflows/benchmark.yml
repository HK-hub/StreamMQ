name: Benchmark

# 手动触发的 JMH 基准任务：结果用于回填 README 性能基准章节（历史数字为旧实现测得，待本任务重新生成）。
on:
  workflow_dispatch:

# 最小权限原则：基准任务只需读取仓库内容
permissions:
  contents: read

# E-14/E-25：同一分支重复触发时取消旧运行，避免两个 JMH 任务互相干扰（共享 Redis 端口/资源）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: JMH Benchmarks
    runs-on: ubuntu-latest
    # F-11 / B2：JMH 任务耗时较长，显式预算 45 分钟（声明参数下的全量运行约 21 分钟，
    # 由 BenchmarkBudgetTest 静态校验 45 分钟上限；更旧的配置结构性需要 2 小时以上）。
    timeout-minutes: 45
    # 基准默认走 docker 模式（Testcontainers 在 runner 内拉起独占 Redis，见 streammq-benchmark/pom.xml），
    # 因此这里的 service 只在把模式切到 -Dstreammq.redis.mode=local 时才会被用到。
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # E-07：此前只 test-compile（不 install），而下一步用 `-pl streammq-benchmark`（无 -am），
      # 干净 runner 上解析不到 reactor 构件（core/redisson/... 不在本地仓库）→ 必然失败。
      # 现在先 install 基准模块及其上游依赖（-am），后续步骤可直接从本地仓库解析。
      - name: Build and install benchmark module and dependencies (skip tests)
        timeout-minutes: 10
        run: mvn -B -pl streammq-benchmark -am install -DskipTests -Dspotless.check.skip=true

      # 参数真源（B4）：fork/预热/测量只由各 Benchmark 类注解决定，main() 不再覆盖，本 workflow 也不再调整。
      # flushdb 守卫：docker 模式清空的是本进程独占容器，自动放行；如改跑 local 模式必须追加
      # -Dstreammq.benchmark.allowFlush=true。
      # 必须用 exec:exec：JMH @Fork 依赖真实子进程的 java.class.path，exec:java 会导致
      # fork 进程找不到 ForkedMain 而失败。
      # 分步骤 + 各自超时：任一基准类卡死只拖垮该步骤，不会吃掉整个 job 预算（预计 10 / 6 / 2 分钟）。
      - name: Run JMH serialization benchmarks (~10 min)
        timeout-minutes: 20
        run: >-
          mvn -B -Pbenchmark -pl streammq-benchmark
          exec:exec@benchmark-serialization

      - name: Run JMH template (send) benchmarks (~6 min)
        timeout-minutes: 12
        run: >-
          mvn -B -Pbenchmark -pl streammq-benchmark
          exec:exec@benchmark-template

      # 消费基准带口径有效性门禁（B1）：测量前预灌积压、测量期间只做低水位补货；若测量期间积压被
      # 耗尽（出现空读），main() 判 INVALID 并以非零码退出——该步骤失败即代表"这一轮消费数字不可用"，
      # 处理方式是加大 -Dstreammq.benchmark.backlog（必要时加 -Dstreammq.benchmark.feederThreads）。
      - name: Run JMH consumer benchmarks with validity gate (~2 min)
        timeout-minutes: 10
        run: >-
          mvn -B -Pbenchmark -pl streammq-benchmark
          exec:exec@benchmark-consumer

      - name: Collect JMH result files
        if: always()
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          found=0
          # JMH 以 ResultFormatType.JSON 输出 jmh-*.json（此前 glob 写的是 jmh*.txt，导致产物恒为空）
          while IFS= read -r -d '' f; do
            cp "$f" benchmark-results/
            found=1
          done < <(find streammq-benchmark/target -maxdepth 1 -type f \
                     \( -name 'jmh*.json' -o -name 'jmh*.txt' \) -print0)
          # 消费基准的口径记录（B1）：一并保留为产物，便于复核"积压是否被耗尽/补货是否跟得上"；
          # 前缀刻意不是 jmh-，故不会进入下面的回归比对（回归脚本只 glob benchmark-results/jmh*.json）。
          while IFS= read -r -d '' f; do
            cp "$f" benchmark-results/
          done < <(find streammq-benchmark/target -maxdepth 1 -type f \
                     -name 'consume-validity-*.json' -print0)
          if [ "$found" -eq 0 ]; then
            echo "::error::no jmh*.json result files produced by benchmarks"
            exit 1
          fi
          ls -la benchmark-results

      # 性能回归门禁：调用仓库内置比对脚本（此前脚本存在但无人调用，自动保护仅有"产物存在"）。
      # 基线 bootstrap：benchmark-baseline.json 目前为空 {}，首次发布后才回填真实基线；
      # 基线缺失/为空时只提示、不失败，避免误拦；基线就绪后由脚本按阈值判定并阻断回归。
      - name: Check benchmark regression vs baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="streammq-benchmark/benchmark-baseline.json"
          has_baseline=false
          if [ -f "$baseline" ] && python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); d=d.get("benchmarks", d) if isinstance(d, dict) else d; sys.exit(0 if d else 1)' "$baseline"; then
            has_baseline=true
          fi
          if [ "$has_baseline" != true ]; then
            echo "::notice::No benchmark baseline yet (${baseline} absent, empty or unreadable) — regression comparison skipped. The baseline is bootstrapped after the first release."
            exit 0
          fi
          python3 streammq-benchmark/scripts/check_benchmark_regression.py \
            --current 'benchmark-results/jmh*.json' \
            --baseline "$baseline"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-results
          path: benchmark-results/
          if-no-files-found: warn
