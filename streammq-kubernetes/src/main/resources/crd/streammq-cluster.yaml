# StreamMQ Kubernetes CustomResourceDefinitions
#
# Full CRD definition with OpenAPI v3 schema validation for:
# - StreamMQCluster: cluster configuration and operator management
#
# NOTE: Only StreamMQCluster is implemented by the operator today.
# StreamMQTopic / StreamMQConsumerGroup CRDs were advertised here previously
# but never implemented by the controller — do not re-add them until the
# operator actually reconciles those kinds.
#
# Required RBAC: watching ALL namespaces by default (operator.watch-all-namespaces=true)
# requires a ClusterRole with get/list/watch on streammqclusters.streammq.io plus
# Deployment create/update/patch/status permissions across namespaces.
# Set operator.watch-all-namespaces=false (with operator.watch-namespaces list)
# to scope the operator to specific namespaces and relax RBAC accordingly.
#
# Requires: Kubernetes 1.16+ (apiextensions.k8s.io/v1)
# Group: streammq.io

---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: streammqclusters.streammq.io
  labels:
    app.kubernetes.io/name: streammq
    app.kubernetes.io/part-of: streammq-operator
  annotations:
spec:
  group: streammq.io
  scope: Namespaced
  names:
    kind: StreamMQCluster
    plural: streammqclusters
    singular: streammqcluster
    shortNames:
    - smq
    - smqcluster
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        description: StreamMQCluster defines a StreamMQ cluster configuration.
        properties:
          spec:
            type: object
            required: [backend, replicas, image]
            properties:
              image:
                type: string
                description: Consumer container image (required).
              backend:
                type: object
                required: [type]
                description: Backend storage configuration.
                properties:
                  type:
                    type: string
                    enum: [redis]
                    default: redis
                    description: Backend storage type.
                  redis:
                    type: object
                    properties:
                      address:
                        type: string
                        description: Redis connection address.
                      namespace:
                        type: string
                        description: Key namespace prefix.
                      masterName:
                        type: string
                        description: Sentinel master name.
                      password:
                        type: string
                        description: "DEPRECATED: inline password; use passwordSecretRef instead."
                      passwordSecretRef:
                        type: object
                        description: Reference to a Secret key holding the Redis password.
                        properties:
                          name:
                            type: string
                          key:
                            type: string
                      poolSize:
                        type: integer
                        minimum: 1
                        maximum: 500
                        default: 50
                      connectTimeoutMs:
                        type: integer
                        default: 5000
                      readTimeoutMs:
                        type: integer
                        default: 3000
              config:
                type: object
                properties:
                  retry:
                    type: object
                    properties:
                      maxReconsumeTimes:
                        type: integer
                        minimum: 1
                        maximum: 128
                        default: 16
                      retryIntervals:
                        type: array
                        items:
                          type: integer
                  delay:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: true
                      scanIntervalMs:
                        type: integer
                        default: 1000
                  tracing:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      sampleRate:
                        type: number
                        minimum: 0.0
                        maximum: 1.0
                        default: 0.1
                      exporter:
                        type: string
                        enum: [otlp, zipkin, jaeger]
                        default: otlp
                      endpoint:
                        type: string
                  compression:
                    type: object
                    properties:
                      enabled:
                        type: boolean
                        default: false
                      algorithm:
                        type: string
                        enum: [gzip, lz4, snappy, zstd]
                        default: gzip
                      threshold:
                        type: integer
                        default: 1024
              replicas:
                type: integer
                minimum: 1
                maximum: 100
                default: 3
              resources:
                type: object
                properties:
                  cpuRequest:
                    type: string
                    default: "500m"
                  cpuLimit:
                    type: string
                    default: "1000m"
                  memoryRequest:
                    type: string
                    default: "512Mi"
                  memoryLimit:
                    type: string
                    default: "1Gi"
              autoScale:
                type: object
                properties:
                  enabled:
                    type: boolean
                    default: false
                  minReplicas:
                    type: integer
                    minimum: 1
                    default: 1
                  maxReplicas:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 10
                  targetLag:
                    type: integer
                    minimum: 1
                    default: 100
                  scaleUpThreshold:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 80
                  scaleDownThreshold:
                    type: integer
                    minimum: 1
                    maximum: 100
                    default: 20
                  stabilizationWindowSeconds:
                    type: integer
                    default: 300
                  scaleUpCooldownSeconds:
                    type: integer
                    default: 60
                  scaleDownCooldownSeconds:
                    type: integer
                    default: 300
              labels:
                type: object
                additionalProperties:
                  type: string
              annotations:
                type: object
                additionalProperties:
                  type: string
          status:
            type: object
            properties:
              phase:
                type: string
                enum: [Pending, Ready, NotReady, Updating, Failed]
              replicas:
                type: integer
              readyReplicas:
                type: integer
              lastUpdateTime:
                type: string
                format: date-time
              observedGeneration:
                type: integer
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: PHASE
      type: string
      jsonPath: .status.phase
    - name: REPLICAS
      type: integer
      jsonPath: .status.replicas
    - name: READY
      type: integer
      jsonPath: .status.readyReplicas
    - name: AGE
      type: date
      jsonPath: .metadata.creationTimestamp

