# StreamMQ 云原生 K8s CRD 定义示例
#
# 本文件为 Kubernetes Custom Resource Definitions 示例，用于通过 K8s 原生方式
# 管理 StreamMQ 集群、Topic 与消费者组。仅作为文档示例，不包含对应的 Go 控制器实现。
#
# 参考：设计文档第 7.1 节

---
# StreamMQCluster - 集群定义
apiVersion: streammq.io/v1
kind: StreamMQCluster
metadata:
  name: production-streammq
  labels:
    app.kubernetes.io/name: streammq
    app.kubernetes.io/instance: production
spec:
  backend:
    type: redis
    redis:
      address: redis://redis-cluster:6379
      namespace: production
  config:
    retry:
      max-reconsume-times: 16
    delay:
      enabled: true
    tracing:
      enabled: true
  replicas: 3

---
# StreamMQTopic - Topic 管理
apiVersion: streammq.io/v1
kind: StreamMQTopic
metadata:
  name: order-topic
  labels:
    app.kubernetes.io/name: streammq
spec:
  clusterRef: production-streammq
  partitions: 8
  max-length: 1000000
  retention-hours: 72

---
# StreamMQConsumerGroup - 消费者组管理
apiVersion: streammq.io/v1
kind: StreamMQConsumerGroup
metadata:
  name: order-consumer-group
  labels:
    app.kubernetes.io/name: streammq
spec:
  clusterRef: production-streammq
  topic: order-topic
  replicas: 3
  autoScale:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetLag: 100
    scaleUpThreshold: 80
    scaleDownThreshold: 20
