spring:
  application:
    name: streammq-sample-quickstart

streammq:
  enabled: true
  namespace: quickstart
  producer:
    group: quickstart-producer-group
  admin:
    enabled: true

# 本地体验：仅暴露必要端点（生产环境请根据实际需要调整）
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,streammq"

# Redisson 配置（示例用单机），生产环境请使用集群配置
redisson:
  singleServerConfig:
    address: "redis://127.0.0.1:6379"
    database: 0
