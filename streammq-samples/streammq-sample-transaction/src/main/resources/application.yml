spring:
  application:
    name: streammq-sample-transaction

streammq:
  enabled: true
  namespace: transaction
  producer:
    group: transaction-producer-group
  # 事务消息回查配置
  transaction:
    check-interval: 60s           # 回查间隔，默认 60s
    max-check-times: 15           # 最大回查次数

# Redisson 配置（示例用单机），生产环境请使用集群配置
redisson:
  singleServerConfig:
    address: "redis://127.0.0.1:6379"
    database: 0
