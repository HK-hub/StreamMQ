services:
  redis:
    image: redis:7.2-alpine
    container_name: streammq-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - streammq

networks:
  streammq:
    name: streammq-net

volumes:
  redis-data:
